<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020806">
  <meta name="description" content="Animated painting of Coach Dinosaur's Endgame Trainer logo.">
  <title>Coach Dinosaur's Endgame Trainer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="stage" aria-label="Coach Dinosaur's Endgame Trainer logo painting animation">
      <canvas id="canvas" width="900" height="900"></canvas>
      <div class="scanline" aria-hidden="true"></div>
      <p class="sr-only" id="animationStatus" aria-live="polite">Painting the Endgame Trainer logo.</p>
    </section>
  </main>

  <img id="logoSource" alt="" hidden>
  <script src="logo.js"></script>
  <script src="app.js"></script>
</body>
</html>
