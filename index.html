<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020806">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="description" content="Animated painting of Coach Dinosaur's Endgame Trainer logo.">
  <title>Coach Dinosaur's Endgame Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260803l">
  <link rel="stylesheet" href="boy.css?v=20260803n">
  <link rel="stylesheet" href="boy-image.css?v=20260803n">
  <link rel="stylesheet" href="desktop-tune.css?v=20260803o">
</head>
<body>
  <main class="app">
    <section class="hero" aria-label="Animated intro for Coach Dinosaur's Endgame Trainer">
      <div class="intro-group">
        <div class="logo-zone" id="logoZone">
          <canvas id="logoCanvas" width="900" height="900" aria-label="Endgame Trainer logo animation"></canvas>
          <div class="scanline" aria-hidden="true"></div>
        </div>

        <div class="copy-zone" id="copyZone" aria-hidden="true">
          <div class="boy-figure" id="boyFigure" aria-hidden="true"></div>
          <p class="brand-line" id="brandLine"></p>
          <h1 class="title-line" id="titleLine"></h1>
          <p class="tagline-line" id="taglineLine"></p>
        </div>
      </div>

      <p class="sr-only" id="status" aria-live="polite">Painting the Endgame Trainer logo.</p>
      <p class="error" id="error">The logo could not be loaded.</p>
    </section>
  </main>

  <script src="logo.js?v=20260803k"></script>
  <script src="audio-part-1.js?v=20260803k"></script>
  <script src="audio-part-2.js?v=20260803k"></script>
  <script src="audio-part-3.js?v=20260803k"></script>
  <script src="audio-part-4.js?v=20260803k"></script>
  <script src="audio-part-5.js?v=20260803k"></script>
  <script src="audio-part-6.js?v=20260803k"></script>
  <script src="app.js?v=20260803k"></script>
</body>
</html>
